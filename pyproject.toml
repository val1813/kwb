[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaiwubridge"]

[project]
name = "kaiwubridge"
version = "0.1.0"
description = "企业多源数据库与LLM之间的智能中间层"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "sqlparse>=0.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sentence-transformers>=2.2.0",
    "jinja2>=3.1.0",
]

[project.scripts]
kwb = "kaiwubridge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
