roles:
  - id: admin
    name: 管理员
    allowed_databases: ["*"]
    allowed_tables:
      "*": ["*"]
    denied_columns: {}
    row_filter: {}

  - id: sales_staff
    name: 销售员工
    allowed_databases: [sales_db]
    allowed_tables:
      sales_db: [orders, customers]
    denied_columns:
      sales_db.orders: [cost_price, profit_margin]
    row_filter:
      sales_db.orders: "region = '{user.region}'"

  - id: sales_manager
    name: 销售经理
    allowed_databases: [sales_db]
    allowed_tables:
      sales_db: [orders, customers, targets]
    denied_columns: {}
    row_filter:
      sales_db.orders: "department = '{user.department}'"

  - id: finance_staff
    name: 财务员工
    allowed_databases: [finance_db, sales_db]
    allowed_tables:
      finance_db: [invoices, expenses]
      sales_db: [orders]
    denied_columns: {}
    row_filter: {}

users:
  - id: admin
    name: 管理员
    role: admin
    attrs: {}

  - id: zhangsan
    name: 张三
    role: sales_staff
    attrs:
      region: 华东
      department: 销售一部

  - id: lisi
    name: 李四
    role: sales_staff
    attrs:
      region: 华北
      department: 销售二部

  - id: wangwu
    name: 王五
    role: sales_manager
    attrs:
      department: 销售三部

  - id: finance_zhao
    name: 赵会计
    role: finance_staff
    attrs: {}
